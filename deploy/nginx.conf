# Alternative nginx (si tu ne veux pas Caddy).
# HTTPS non géré ici : utilise certbot (Let's Encrypt) pour ajouter le SSL.
# sudo certbot --nginx -d psystat.ton-domaine.com

server {
    listen 80;
    server_name psystat.ton-domaine.com;
    root /var/www/psystat;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    types {
        application/wasm wasm;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
